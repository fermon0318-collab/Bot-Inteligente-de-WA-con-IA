<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ApolAI">
  <title>ApolAI</title>
  <!-- Paleta ApolAI: contorno #6D28D9 · panel facial #8B5CF6 · relleno cabeza #EEF2FF -->
  <g fill="none" stroke="#6D28D9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Antenas -->
    <path d="M45 34 L35 15" />
    <path d="M83 34 L93 15" />
  </g>
  <!-- Esferas de las antenas -->
  <circle cx="35" cy="13" r="7.5" fill="#6D28D9" />
  <circle cx="93" cy="13" r="7.5" fill="#6D28D9" />
  <!-- Punto/detalle a la izquierda de la cabeza -->
  <circle cx="9" cy="68" r="6" fill="#6D28D9" />
  <!-- Cabeza -->
  <rect x="18" y="30" width="92" height="76" rx="26" ry="26"
        fill="#EEF2FF" stroke="#6D28D9" stroke-width="8" stroke-linejoin="round" />
  <!-- Panel facial (píldora redondeada) -->
  <rect x="32" y="48" width="64" height="40" rx="20" ry="20"
        fill="#8B5CF6" stroke="#6D28D9" stroke-width="6" stroke-linejoin="round" />
  <!-- Ojo abierto -->
  <circle cx="50" cy="64" r="6" fill="#EEF2FF" />
  <!-- Ojo guiñando -->
  <path d="M72 61 L84 67" fill="none" stroke="#EEF2FF" stroke-width="6" stroke-linecap="round" />
  <!-- Boca sonriente -->
  <path d="M55 75 Q64 84 74 75" fill="none" stroke="#EEF2FF" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
