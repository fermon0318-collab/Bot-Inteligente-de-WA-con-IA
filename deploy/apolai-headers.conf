# Cabeceras de seguridad de ApolAI.
# Se instala en /etc/nginx/snippets/apolai-headers.conf
#
# Dos trampas de nginx que este archivo evita:
#
#  1. Un `add_header` dentro de un `location` REEMPLAZA todos los heredados del
#     bloque `server`. Por eso este snippet se incluye también en cada location
#     que define cabeceras propias; si no, la landing se serviría sin CSP ni
#     HSTS y no se notaría hasta una auditoría.
#
#  2. La continuación de línea con `\` no existe en nginx: dentro de una cadena
#     entrecomillada se guarda como barra literal, la cabecera resultante es
#     inválida y el navegador la descarta en silencio. La CSP va en una sola
#     línea aunque quede larga.

# HSTS: obliga a HTTPS durante un año. Actívalo solo cuando el certificado
# funcione, porque el navegador lo recuerda y revertirlo cuesta.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# CSP ajustada a lo que el sitio carga de verdad.
# 'unsafe-eval' lo exige el CDN de Tailwind: si compilas el CSS (ver
# deploy/README.md) puedes quitar ese permiso y cerrar la política del todo.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://lh3.googleusercontent.com https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; connect-src 'self'; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; base-uri 'self'; frame-ancestors 'self'" always;
