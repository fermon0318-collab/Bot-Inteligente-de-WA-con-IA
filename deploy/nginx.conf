# ============================================================================
# Elorai · configuración de nginx
#
# Instalar en /etc/nginx/sites-available/elorai y enlazar a sites-enabled.
# Sustituye DOMINIO por tu dominio real (lo hace deploy.sh automáticamente).
#
# Reparto de responsabilidades:
#   · nginx sirve los archivos estáticos y termina TLS
#   · Node solo atiende /api, /auth y /webhook, escuchando en 127.0.0.1
# ============================================================================

# Límite de intentos de login: frena el abuso sin molestar al uso normal.
limit_req_zone $binary_remote_addr zone=elorai_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=elorai_api:10m rate=120r/m;

upstream elorai_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- Redirección a HTTPS ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;

    # Certbot necesita servir este directorio por HTTP para renovar
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://DOMINIO$request_uri;
    }
}

# --- Redirección de www a dominio raíz -------------------------------------
server {
    # `listen ... http2` en lugar de `http2 on;` para funcionar también en
    # nginx 1.24, que es el que trae Ubuntu 24.04.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;

    return 301 https://DOMINIO$request_uri;
}

# --- Sitio -----------------------------------------------------------------
server {
    # `listen ... http2` en lugar de `http2 on;` para funcionar también en
    # nginx 1.24, que es el que trae Ubuntu 24.04.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO;

    root /var/www/elorai;
    index index.html;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    include /etc/nginx/snippets/elorai-headers.conf;

    # --- Compresión --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    client_max_body_size 20m;

    # --- Panel protegido ---------------------------------------------------
    # nginx consulta a Node antes de entregar el panel. Así la protección no
    # depende del JavaScript del navegador: sin sesión no se sirve el HTML.
    location = /dashboard.html {
        auth_request /internal/auth;
        # auth_request solo propaga 401 y 403; el backend traduce
        # "sin suscripción" a 403 precisamente por esto.
        error_page 401 = @sin_sesion;
        error_page 403 = @sin_suscripcion;

        include /etc/nginx/snippets/elorai-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /internal/auth {
        internal;
        proxy_pass              http://elorai_app;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        Host $host;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
    }

    location @sin_sesion {
        return 302 /?login=required&next=/dashboard.html;
    }

    location @sin_suscripcion {
        return 302 /?suscripcion=requerida#precios;
    }

    # --- Backend -----------------------------------------------------------
    location /auth/ {
        limit_req zone=elorai_auth burst=10 nodelay;
        proxy_pass http://elorai_app;
        include /etc/nginx/snippets/elorai-proxy.conf;
    }

    location /api/ {
        limit_req zone=elorai_api burst=40 nodelay;
        proxy_pass http://elorai_app;
        include /etc/nginx/snippets/elorai-proxy.conf;
    }

    # Webhooks entrantes (Stripe y WhatsApp): sin límite de tasa, porque quien
    # llama es el proveedor y perder un evento cuesta caro.
    location /webhook/ {
        proxy_pass http://elorai_app;
        include /etc/nginx/snippets/elorai-proxy.conf;
    }

    # --- Estáticos ---------------------------------------------------------
    # Los assets llevan hash de contenido en producción; mientras no sea así,
    # una semana con revalidación es un punto medio razonable.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        include /etc/nginx/snippets/elorai-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        access_log off;
        try_files $uri =404;
    }

    # El HTML nunca se cachea: si no, un despliegue tarda en verse
    location ~* \.html$ {
        include /etc/nginx/snippets/elorai-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = / {
        include /etc/nginx/snippets/elorai-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Nunca servir el backend, las dependencias ni el control de versiones
    location ~ ^/(server|node_modules|tools|\.git|deploy)/ {
        deny all;
        return 404;
    }

    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
